name: Manual Windows validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      DELTA_PYTHON_VERSION: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Exercise real batch files and dashboard
        shell: powershell
        run: .\scripts\verify_windows.ps1
      - name: Preserve Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-validation-evidence-${{ matrix.python-version }}
          path: .cache/windows-smoke/
